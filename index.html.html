const quests=[{id:'forest',icon:'🌲',title:'Forest of Inference',skill:'Inferencing',x:25,y:32,description:'Follow the clues to discover what the missing lantern means.',passage:[`[1] When Mira reached the village gate, the lantern was gone. For years it had burned beside the stone arch, even on mornings when rain washed the path into muddy streams. The keeper had always said that a lit lantern meant someone was watching over the road.`,`[2] Mira searched the ground. A pale circle marked the place where the lantern had stood. Beside it lay three dry pine needles, though the nearest pines grew beyond the northern ridge. She knelt and found a narrow line in the mud, as if something heavy had been dragged toward the orchard.`,`[3] Her brother Tomas arrived carrying a basket of bread. “The keeper probably took it to clean,” he said. Mira pointed toward the orchard. “Then why would he drag it away?” Tomas glanced at the tracks but said nothing.`,`[4] They followed the line until it disappeared beneath fallen leaves. At the orchard fence, a strip of blue cloth fluttered from a broken nail. Mira recognized the color: the keeper wore a blue scarf every winter. But the cloth was new and smooth, while his scarf was faded and rough.`,`[5] Beyond the fence stood an abandoned greenhouse. One of its windows glowed faintly. Mira pressed her ear to the door and heard a soft scraping sound. She wanted to run for help, but the path behind them had already grown dark.`,`[6] Tomas lifted the bread basket. “If someone is inside, we should ask,” he whispered. Mira shook her head. “First we should understand what we're seeing.” She noticed fresh footprints leading into the greenhouse, but none leading out.`,`[7] A gust of wind pushed the door open. Inside, the lantern hung from a wooden beam. Its light fell across rows of tiny seedlings protected from the cold. A note rested on the worktable: *Please forgive me for borrowing the light. The first frost came early, and the new trees would not survive the night.*`,`[8] Mira read the note twice. The lantern had not been stolen for treasure or mischief. Someone had moved it to save the orchard's future. She and Tomas carried a spare lamp from the greenhouse back to the gate, leaving the lantern where its warmth was needed.`],questions:[['Which detail best suggests that the lantern was moved recently?',['The stone arch was old.','A pale circle marked where it stood.','The road became muddy in rain.','The keeper wore a scarf.'],1,'The pale circle shows the lantern had occupied that spot until recently.'],['What can be inferred from Mira’s response to Tomas in paragraph 6?',['She prefers to gather evidence before acting.','She wants to keep the greenhouse secret.','She does not trust her brother.','She plans to leave the village.'],0,'Mira says they should understand what they see before taking action.'],['Why does the author mention the pine needles?',['To establish the season','To show the road is dangerous','To provide a clue about movement from elsewhere','To explain the keeper’s routine'],2,'The needles come from a location away from the gate, making them an unusual clue.'],['What does the blue cloth initially suggest?',['The greenhouse is new.','The keeper may be connected to the mystery.','Tomas has been there.','The orchard is abandoned.'],1,'The blue cloth resembles the keeper’s scarf, suggesting a possible connection.'],['Which statement best describes Tomas?',['He refuses to help Mira.','He quickly assumes a simple explanation.','He knows who took the lantern.','He is afraid of the orchard.'],1,'His first explanation is that the keeper took the lantern to clean it.'],['What does the note reveal?',['The lantern was moved to protect seedlings.','The keeper has left the village.','The greenhouse belongs to Mira.','The gate no longer needs light.'],0,'The note explicitly explains that the lantern helps the seedlings survive frost.'],['How does the discovery change the central conflict?',['It creates a new argument.','It proves Tomas was correct.','It resolves the mystery and introduces a compassionate reason.','It makes the lantern more valuable.'],2,'The characters learn the reason behind the disappearance and respond with empathy.'],['Which theme is best supported by the ending?',['Rules must never change.','Appearances can hide acts of kindness.','Working alone is always best.','Curiosity causes trouble.'],1,'What looked like theft was an attempt to protect young trees.']]},{id:'tower',icon:'🏯',title:'Tower of Themes',skill:'Theme and evidence',x:75,y:27,description:'Discover the lesson hidden in an old tower.',passage:[`[1] The bell in the old tower had not rung in forty years. Each spring the town held a festival beneath it, and each spring the mayor promised that the bell would ring again. No one volunteered to repair it.`,`[2] This year, Leena brought a box of tools and a notebook filled with sketches. She had spent winter afternoons studying gears in the library. Her neighbors smiled politely when she announced her plan.`,`[3] “That bell is older than your grandfather,” one man said. “You cannot fix everything with a book.” Leena thanked him and climbed the first flight of stairs.`,`[4] Inside, dust covered the iron wheels. She cleaned each tooth and examined the rope, which had worn thin near the ceiling. By evening, she had replaced the rope, but the bell remained silent.`,`[5] The next morning she returned with her friend Amari. Together they tested the mechanism. When Amari turned the largest wheel, a smaller gear slipped out of place. They spent hours adjusting it, only to discover a cracked support beam.`,`[6] Leena sat on the steps, exhausted. “Maybe everyone was right,” she said. Amari pointed to the notebook. “You solved three problems already. Why should the fourth be the one that stops you?”`,`[7] They asked the village carpenter for help. He arrived with two apprentices and a strong length of oak. By sunset the beam was secure. Leena climbed the stairs once more and pulled the rope.`,`[8] The bell sounded across the rooftops, startling birds from the square. Below, the neighbors cheered. Leena knew she had not restored the bell alone, and that made its music even sweeter.`],questions:[['What is a central theme of the story?',['Old objects are never worth repairing.','Persistence and cooperation can overcome obstacles.','Only experts should attempt repairs.','Festivals bring communities together.'],1,'Leena persists and accepts help to finish the work.'],['What does Leena’s notebook reveal about her?',['She is prepared and curious.','She dislikes her neighbors.','She plans to leave town.','She wants to become mayor.'],0,'Her sketches and study show preparation.'],['How does the man’s comment affect the story?',['It provides a solution.','It reveals the bell’s age only.','It establishes doubt that Leena must overcome.','It ends the conflict.'],2,'His doubt creates an obstacle to Leena’s confidence.'],['Which event is the turning point?',['The annual festival begins.','Leena studies gears.','Amari offers encouragement and they seek help.','The mayor makes a promise.'],2,'Support from others helps Leena continue.'],['Why is the cracked beam important?',['It shows a new challenge requiring help.','It proves the bell cannot ring.','It explains the festival.','It causes the town to evacuate.'],0,'The beam creates a problem that calls for collaboration.'],['Which detail best supports the theme?',['The tower is forty years old.','The birds fly away.','The mayor speaks every spring.','The carpenter and apprentices help secure the beam.'],3,'Community assistance directly supports the theme.'],['What can be inferred about Leena at the end?',['She regrets repairing the bell.','She values the contribution of others.','She plans to keep the bell secret.','She thinks books are useless.'],1,'She recognizes the bell was restored through shared effort.'],['How does the ending develop the story’s message?',['It suggests promises are pointless.','It shows Leena becoming famous.','It emphasizes success made sweeter by teamwork.','It warns against old buildings.'],2,'The final line connects the success to teamwork.']]},{id:'forge',icon:'⚒️',title:'Grammar Forge',skill:'Revising and editing',x:50,y:75,description:'Repair a message to restore the kingdom’s forge.',passage:[`[1] The village forge is one of the most important building in the kingdom.`,`[2] Each morning, the blacksmith opens the doors before sunrise.`,`[3] She checks the tools, heats the coals, and prepare the workbench.`,`[4] Villagers bring broken hinges, farming tools, and lantern hooks for repair.`,`[5] Although the work is difficult, the blacksmith enjoys helping her neighbors.`,`[6] Last week a storm damaged the bridge, the blacksmith worked through the night to make new metal supports.`,`[7] By morning, the bridge was safe again.`,`[8] The villagers thanked her, and they promised to keep the forge supplied with wood and iron.`,`[9] The blacksmith smiled because she knew the village was strongest when everyone worked together.`],questions:[['What change should be made in sentence 1?',['Change is to are','Change building to buildings','Change important to importantly','No change'],1,'The phrase “one of the most important” requires plural “buildings.”'],['What change is needed in sentence 3?',['Change checks to check','Change heats to heated','Change prepare to prepares','No change'],2,'The singular subject “She” takes “prepares.”'],['Which punctuation best revises sentence 6?',['Replace the comma with a semicolon.','Remove the comma.','Add a comma after bridge.','Add a question mark.'],0,'Two independent clauses can be joined by a semicolon.'],['Which sentence best introduces the paragraph?',['Metal is often heavy.','Many people like bridges.','The village depends on workers who serve their neighbors.','Storms are sometimes loud.'],2,'This introduces the central idea of community service.'],['Which sentence provides the strongest supporting example of the blacksmith’s dedication?',['Sentence 2','Sentence 4','Sentence 6','Sentence 8'],2,'Working through the night after a storm shows dedication.'],['Which transition could best begin sentence 7?',['However,','By contrast,','For example,','As a result,'],3,'The repaired supports led to the bridge being safe.'],['Which sentence best combines the ideas in sentence 8?',['The villagers thanked her and promised to supply the forge with wood and iron.','The villagers thanked, promising wood, iron, and her.','The villagers promised and thanking the forge.','The villagers, thanked her promised supplies.'],0,'This option is concise and grammatically correct.'],['What is the most effective concluding idea?',['The forge has many tools.','The bridge crosses a river.','The blacksmith works early.','A strong community is built through shared effort.'],3,'This conclusion reinforces the paragraph’s main idea.']]}];
const builds=[{id:'cottage',name:'Cottage',icon:'🏠',cost:30},{id:'garden',name:'Flower Garden',icon:'🌷',cost:45},{id:'tower',name:'Watchtower',icon:'🗼',cost:75},{id:'dragon',name:'Dragon Statue',icon:'🐉',cost:100}];function save(){localStorage.setItem(key,JSON.stringify(s))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sync(){document.getElementById('xp').textContent=s.xp;document.getElementById('gold').textContent=s.gold;document.getElementById('level').textContent=1+Math.floor(s.xp/150)}function show(t){screen=t;current=null;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+t));render()}function render(){sync();let v=document.getElementById('view');if(current){renderQuest();return}if(screen==='map'){v.innerHTML=`<section class="panel"><h2>✦ Choose Your Next Adventure ✦</h2><p class="muted">Three magical realms await! Choose a destination, read its story, and solve eight challenges to earn treasure for your village.</p><div class="map">${quests.map(q=>`<button class="place" style="left:${q.x}%;top:${q.y}%" onclick="start('${q.id}')"><span>${q.icon}</span>${q.title}<small>${s.completed.includes(q.id)?'✓ Completed · replay available':'8 questions · earn rewards'}</small></button>`).join('')}</div><p class="muted">Teacher note: This prototype uses three sample quests. Production passages will be longer and teacher-reviewed.</p></section>`}else if(screen==='village'){v.innerHTML=`<section class="panel"><h2>🏡 ${esc(s.name)}'s Kingdom Village</h2><p class="muted">Every adventure brings new treasures. Spend your gold to turn your starter camp into a thriving fantasy village!</p><div class="village"><div class="building">🏕️<small>Starter Camp</small></div>${s.buildings.map(id=>{let b=builds.find(x=>x.id===id);return `<div class="building">${b.icon}<small>${b.name}</small></div>`}).join('')}</div><h3>Village Market</h3><div class="cards">${builds.map(b=>`<div class="card"><div style="font-size:36px">${b.icon}</div><h3>${b.name}</h3><p>🪙 ${b.cost} Gold</p><button class="primary" ${s.buildings.includes(b.id)||s.gold<b.cost?'disabled':''} onclick="buy('${b.id}')">${s.buildings.includes(b.id)?'Built':'Build'}</button></div>`).join('')}</div></section>`}else{v.innerHTML=`<section class="panel"><h2>📜 Adventure Journal</h2><div class="flex"><label>Adventurer name: <input maxlength="24" id="player" value="${esc(s.name)}"></label><button class="secondary" onclick="rename()">Save name</button></div><p class="muted">This name and progress are saved in this browser only.</p><h3>Recent Quest Results</h3>${s.history.length?s.history.slice().reverse().map(h=>`<div class="card" style="margin:8px 0"><b>${esc(h.title)}</b> · ${h.score}/8 correct · ${esc(h.date)}</div>`).join(''):'<p>No completed quests yet.</p>'}<h3>Mastery snapshot (practice only)</h3>${quests.map(q=>{let hist=s.history.filter(h=>h.id===q.id);let avg=hist.length?Math.round(hist.reduce((a,h)=>a+h.score,0)/hist.length/8*100):null;return `<div class="card" style="margin:8px 0">${q.skill}: ${avg===null?'Not attempted':avg+'% across '+hist.length+' attempt(s)'}</div>`}).join('')}<p class="muted">The teacher dashboard and data imports are planned features, not active in this prototype.</p><button class="secondary" onclick="resetDemo()">Reset prototype data</button></section>`}}function rename(){s.name=document.getElementById('player').value.trim()||'Adventurer';save();render()}function buy(id){let b=builds.find(x=>x.id===id);if(!b||s.gold<b.cost||s.buildings.includes(id))return;s.gold-=b.cost;s.buildings.push(id);save();render()}function start(id){current=quests.find(q=>q.id===id);idx=0;chosen=null;score=0;locked=false;renderQuest()}function renderQuest(){sync();let q=current,v=document.getElementById('view');let p=q.questions[idx];v.innerHTML=`<section class="panel"><div class="flex" style="justify-content:space-between"><h2>${q.icon} ${q.title}</h2><button class="secondary" onclick="show('map')">Exit quest</button></div><p class="muted">${q.description}</p><div class="progress"><div style="width:${idx/8*100}%"></div></div><p>Question ${idx+1} of 8 · ${q.skill}</p><details ${idx===0?'open':''}><summary style="cursor:pointer;font-weight:bold;padding:12px">📖 Read / reopen passage</summary><div class="reading"><h3>${q.title}: The Story</h3>${q.passage.map(x=>`<p>${esc(x)}</p>`).join('')}</div></details><p class="question">${esc(p[0])}</p>${p[1].map((a,i)=>`<button class="option ${chosen===i?'selected':''}" onclick="choose(${i})" ${locked?'disabled':''}>${'ABCD'[i]}. ${esc(a)}</button>`).join('')}<div id="feedback">${locked?`<div class="feedback"><b>${chosen===p[2]?'✓ Correct!':'Not quite.'}</b> ${esc(p[3])}</div>`:''}</div><button class="primary" ${chosen===null?'disabled':''} onclick="${locked?'next()':'check()'}">${locked?(idx===7?'Finish Quest':'Next Question →'):'Check Answer'}</button></section>`}function choose(i){if(locked)return;chosen=i;renderQuest()}function check(){if(chosen===null)return;locked=true;if(chosen===current.questions[idx][2])score++;renderQuest()}function next(){if(idx===7){finish();return}idx++;chosen=null;locked=false;renderQuest()}function finish(){let q=current,first=!s.completed.includes(q.id);let earned=20+score*5+(first?20:0);let coins=10+score*5+(first?15:0);s.xp+=earned;s.gold+=coins;if(first)s.completed.push(q.id);s.history.push({id:q.id,title:q.title,score,date:new Date().toLocaleDateString()});save();current=null;sync();document.getElementById('view').innerHTML=`<section class="panel" style="text-align:center"><div style="font-size:64px">🎉</div><h2>Quest Complete!</h2><h3>${q.title}</h3><p>You answered <b>${score} of 8</b> questions correctly.</p><div class="flex" style="justify-content:center"><div class="pill">⭐ +${earned} XP</div><div class="pill">🪙 +${coins} Gold</div></div><p class="muted">${score<6?'Keep practicing! Replaying a quest helps strengthen your skills.':'Excellent work! Visit your village to spend your gold.'}</p><button class="primary" onclick="show('village')">🏡 Visit My Village</button> <button class="secondary" onclick="show('map')">🗺️ Explore Realms</button></section>`}function resetDemo(){if(confirm('Erase this browser’s SkillQuest demo progress?')){s={...initial,completed:[],buildings:[],history:[],answers:{}};save();render()}}show('map');
</script></body></html>
